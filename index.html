<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>旅行计划</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>
:root{
  --bg:#F2F2F7; --card:#fff; --label:#000;
  --secondary:rgba(60,60,67,.6); --tertiary:rgba(60,60,67,.3); --sep:rgba(60,60,67,.18);
  --blue:#007AFF; --red:#FF3B30; --fill:rgba(118,118,128,.12);
  --nav-bg:rgba(242,242,247,.9); --desk-bg:#dcdce3; --fab-bg:rgba(255,255,255,.95);
  --num-bg:rgba(0,122,255,.12); --wx-bg:rgba(0,122,255,.08); --check-bd:rgba(60,60,67,.3); --as-bg:rgba(249,249,249,.95);
  --card-active:#f4f4f8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  background:var(--bg);color:var(--label);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
#frame{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media(min-width:561px){body{background:var(--desk-bg)}#frame{box-shadow:0 0 40px rgba(0,0,0,.18)}}

/* ---------- 屏幕切换 ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .38s cubic-bezier(.32,.72,0,1)}
#screen-detail{transform:translateX(100%);z-index:10;box-shadow:-10px 0 30px rgba(0,0,0,.08)}
body.detail-open #screen-detail{transform:translateX(0)}
body.detail-open #screen-list{transform:translateX(-25%)}

/* ---------- 导航栏 ---------- */
.nav{flex:none;padding-top:env(safe-area-inset-top);background:var(--nav-bg);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
.nav-row{display:flex;align-items:center;height:52px;padding:0 12px}
.nav-large{flex:1;font-size:30px;font-weight:700;letter-spacing:-.4px;padding-left:6px}
.nav-btn{display:flex;align-items:center;gap:2px;color:var(--blue);font-size:17px;min-height:44px;padding:0 8px}
.nav-title{font-size:15px;font-weight:600;line-height:1.25;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 4px}
.nav-row.detail{display:grid;grid-template-columns:1fr auto 1fr}
.nav-row.detail .nav-btn.right{justify-self:end}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- 行程列表 ---------- */
.trip-list{padding:8px 16px 48px;display:flex;flex-direction:column;gap:12px}
.trip-card{background:var(--card);border-radius:16px;padding:14px 16px;text-align:left}
.trip-card:active{background:var(--card-active)}
.trip-name{font-size:17px;font-weight:600}
.trip-meta{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--secondary);flex-wrap:wrap}
.trip-dates{margin-top:4px;font-size:12px;color:var(--tertiary)}
.card-menu{float:right;color:var(--tertiary);font-size:18px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;margin:-6px -6px 0 0}
.empty{padding:120px 40px;text-align:center}
.empty-icon{font-size:56px}
.empty-title{font-size:20px;font-weight:600;margin:16px 0 8px}
.empty-sub{font-size:14px;color:var(--secondary);line-height:1.7}

/* ---------- 行程详情 ---------- */
.range-line{flex:none;text-align:center;font-size:12px;color:var(--secondary);padding:2px 16px 0}
.day-pills{flex:none;display:flex;gap:10px;overflow-x:auto;padding:10px 16px 6px;scrollbar-width:none}
.day-pills::-webkit-scrollbar{display:none}
.pill{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 14px;border-radius:12px;background:var(--card);transition:background .2s}
.pill .pill-day{font-size:13px;font-weight:600}
.pill .pill-date{font-size:11px;opacity:.75}
.pill.active{background:var(--blue);color:#fff}

.section{margin:16px 16px 0}
.section-title{font-size:13px;color:var(--secondary);margin:0 0 7px 16px}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.footnote{font-size:12px;color:var(--secondary);margin:7px 16px 0;line-height:1.5}
.bottom-space{height:56px}

.row{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 16px;text-align:left;font-size:16px;min-height:46px}
.row + .row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.tappable:active{background:rgba(0,0,0,.04)}
.hint{color:var(--secondary);font-size:14px}
.action-row{color:var(--blue);font-weight:400}

/* 天气 */
.weather{gap:14px}
.weather-icon{font-size:32px;width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--wx-bg);border-radius:12px}
.weather-info{flex:1;min-width:0}
.weather-cond{font-weight:600;font-size:17px}
.weather-sub{color:var(--secondary);font-size:14px;margin-top:2px}
.weather-sub b{color:var(--label);font-weight:600}

/* 地图与路线 */
.map-wrap{position:relative}
.map-ctrl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:700}
.map-btn{width:34px;height:34px;border-radius:10px;background:var(--fab-bg);box-shadow:0 1px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.map-btn.on{color:var(--red)}
#map{height:220px;width:100%;background:#e8e8ee}
.map-fallback{height:220px;display:flex;align-items:center;justify-content:center;color:var(--secondary);font-size:14px}
.pin-outer{background:none;border:none}
.pin.hotel{background:#FF9F0A;font-size:14px}
.photo-item{padding:12px 16px;position:relative}
.photo-item + .photo-item::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.photo-where{font-size:15px;font-weight:600;line-height:1.45}
.photo-pose{font-size:13.5px;color:var(--secondary);margin-top:4px;line-height:1.55}
.photo-time{font-size:12px;color:var(--tertiary);margin-top:3px}
.pin{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.35);border:2px solid #fff}
.leaflet-container{font:inherit}
.leaflet-control-attribution{font-size:9px!important;background:rgba(255,255,255,.7)!important}
.num{width:28px;height:28px;border-radius:50%;background:var(--num-bg);color:var(--blue);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.stop-info{flex:1;min-width:0}
.stop-name{font-size:16px}
.stop-addr{font-size:12px;color:var(--secondary);line-height:1.45;word-break:break-word}
.row-btns{display:flex;gap:6px;flex:none}
.icon-btn{width:30px;height:30px;border-radius:50%;background:var(--fill);color:var(--secondary);display:flex;align-items:center;justify-content:center}
.icon-btn:disabled{opacity:.32}
.icon-btn.del{color:var(--red)}
.icon-btn.nav{font-size:13px}
.transit-row{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 16px 7px 56px;font-size:12.5px;color:var(--tertiary);background:rgba(118,118,128,.055);position:relative}
.transit-row.has{color:var(--secondary)}
.transit-row:active{background:rgba(118,118,128,.12)}
.transit-row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.note-main{flex:1;min-width:0}
.note-place{display:block;font-size:11px;padding:0;margin-top:2px;color:var(--tertiary);text-align:left;line-height:1.35;word-break:break-word}
.note-place.has{color:var(--blue)}
.export-area,.import-area{display:block;width:calc(100% - 32px);margin:0 16px 12px;height:170px;font-size:11px;line-height:1.4;font-family:Consolas,"Courier New",monospace;border:1px solid var(--sep);border-radius:10px;padding:8px;background:#fff;color:#111;resize:none}
.import-error{color:var(--red);font-size:13px;margin:0 20px 8px;display:none}

/* 撤回悬浮按钮 + 操作记录 */
#undo-fab{position:absolute;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;background:var(--fab-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:21px;box-shadow:0 3px 14px rgba(0,0,0,.16);padding:0 6px;z-index:45;border:1px solid rgba(0,0,0,.05)}
#undo-fab button{width:38px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--blue)}
#undo-fab .fab-div{width:1px;height:18px;background:var(--sep)}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:rgba(28,28,30,.92);color:#fff;font-size:13.5px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:120;max-width:82%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.plain-input{width:100%;border:0;background:none;outline:none;font-size:16px;padding:4px 0;min-width:0;text-align:left;line-height:1.4}
.t-line-input{width:100%;border:0;background:none;outline:none;font-size:15px;line-height:1.5;resize:none;padding:4px 0;min-height:52px;color:var(--label);font-family:inherit}
.form-row input[type="number"]{flex:1;text-align:right;font-size:16px;border:0;background:none;outline:none;min-width:0;padding:10px 0;-moz-appearance:textfield}
.form-row input[type="number"]::-webkit-outer-spin-button,.form-row input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* 三餐 */
.meal-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.meal-info{flex:1;min-width:0}
.meal-type{font-size:12px;color:var(--secondary)}
.meal-content{font-size:16px}
.meal-content.is-empty{color:var(--tertiary)}
.meal-place{font-size:12px;color:var(--secondary);margin-top:1px}
.chev{color:var(--tertiary);font-size:20px;flex:none}

/* 备注 */
.check{width:25px;height:25px;flex:none;border-radius:50%;border:1.5px solid var(--check-bd);display:flex;align-items:center;justify-content:center}
.check.on{background:var(--blue);border-color:var(--blue)}
.note-text{flex:1;min-width:0;font-size:16px;word-break:break-word}
.note-text.done{text-decoration:line-through;color:var(--secondary)}
.cat-chip{font-size:11px;padding:3px 8px;border-radius:999px;flex:none}
.note-add{display:flex;gap:8px;padding:10px 12px 4px;align-items:center}
#note-input{flex:1;height:36px;border:0;background:var(--fill);border-radius:10px;padding:0 10px;font-size:15px;outline:none;min-width:0}
.add-btn{width:34px;height:34px;color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.add-btn:disabled{opacity:.35}
.chip-row{display:flex;gap:8px;padding:6px 12px 12px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--fill);color:var(--secondary)}
.chip.active{background:rgba(0,122,255,.14);color:var(--blue);font-weight:600}

/* ---------- 底部弹层 ---------- */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.backdrop.show{opacity:1;pointer-events:auto}
#backdrop2{z-index:70}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--bg);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .38s cubic-bezier(.32,.72,0,1);padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:88dvh;overflow-y:auto}
.sheet.open{transform:none}
#main-sheet{z-index:60}
#picker-sheet{z-index:80}
.grabber{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.25);margin:8px auto 2px}
.sheet-nav{display:flex;align-items:center;justify-content:space-between;padding:2px 12px 6px}
.sheet-title{font-size:17px;font-weight:600;padding-left:8px}

/* 表单 */
.form-card{margin:6px 16px 0}
.form-row{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 16px;width:100%;text-align:left;font-size:16px;position:relative}
.form-row + .form-row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.form-row label{flex:none;color:var(--label)}
.form-row input[type="text"],.form-row input:not([type]){flex:1;text-align:right;font-size:16px;border:0;background:none;outline:none;min-width:0;padding:10px 0}
.form-row input[type="date"]{flex:1;text-align:right;font-size:16px;border:0;background:none;outline:none;min-width:0;-webkit-appearance:none;appearance:none}
.form-value{flex:1;text-align:right;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.4;word-break:break-word}
.form-value.placeholder{color:var(--tertiary)}
.form-row.col{flex-direction:column;align-items:stretch;gap:3px;padding:10px 16px;min-height:0}
.form-row.col label{font-size:12px;color:var(--secondary)}
.form-row.col input{border:0;background:none;outline:none;font-size:16px;padding:4px 0 6px}
.form-foot{font-size:12px;color:var(--secondary);margin:12px 22px 0}
.primary-btn{display:block;width:calc(100% - 32px);margin:16px 16px 4px;height:50px;border-radius:14px;background:var(--blue);color:#fff;font-size:17px;font-weight:600}
.primary-btn:active{opacity:.85}

/* 地点选择 */
.search-row{display:flex;align-items:center;gap:8px;margin:6px 16px 10px;background:var(--fill);border-radius:10px;padding:9px 12px;color:var(--secondary)}
.search-row input{flex:1;border:0;background:none;outline:none;font-size:16px;color:var(--label);min-width:0}
.clear-btn{color:var(--tertiary);display:flex;align-items:center}
.loc-error{color:var(--red);font-size:13px;margin:0 16px 8px}
.result-name{font-size:16px}
.result-addr{font-size:12px;color:var(--secondary);margin-top:1px}

/* ---------- 操作菜单 ---------- */
.as-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.as-backdrop.show{opacity:1;pointer-events:auto}
.as-panel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:95;padding:0 8px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .35s cubic-bezier(.32,.72,0,1)}
.as-panel.show{transform:none}
.as-group{background:var(--as-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;overflow:hidden;margin-top:8px}
.as-btn{display:block;width:100%;min-height:56px;text-align:center;font-size:19px;color:var(--blue);position:relative}
.as-btn + .as-btn::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}
.as-btn:active{background:rgba(0,0,0,.06)}
.as-btn.danger{color:var(--red)}
.as-btn.sub{color:var(--secondary);font-size:13px;min-height:44px}
.as-btn.cancel{font-weight:600}

/* 时间轴 / 向导 / 花费 / 预约 */
.stop-time{font-size:11px;color:var(--blue);margin-top:1px;font-variant-numeric:tabular-nums}
.guide-card{margin:6px 16px 0;background:var(--card);border-radius:16px;padding:18px 16px;text-align:center}
.guide-label{font-size:12px;color:var(--secondary);letter-spacing:.08em}
.guide-name{font-size:22px;font-weight:700;margin:6px 0 2px}
.guide-addr{font-size:13px;color:var(--secondary)}
.guide-meta{font-size:13px;color:var(--blue);margin-top:8px;min-height:18px}
.guide-transit{font-size:12.5px;color:var(--secondary);margin-top:6px}
.guide-done-btn{display:block;width:calc(100% - 32px);margin:10px 16px 0;height:46px;border-radius:13px;background:rgba(52,199,89,.14);color:#34C759;font-size:16px;font-weight:600}
.guide-done-big{text-align:center;padding:34px 20px;font-size:17px;font-weight:600;line-height:1.7}
.expense-amt{font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.resv-code{font-family:Consolas,"Courier New",monospace;font-size:12.5px;background:var(--fill);padding:2px 8px;border-radius:6px;display:inline-block;margin-top:4px}

/* 宽屏双栏：左行程 右地图 */
@media (min-width: 900px){
  #frame{max-width:1140px}
  #day-content{display:grid;grid-template-columns:minmax(0,1fr) 480px;column-gap:22px;align-items:start}
  #day-content .section{grid-column:1}
  #day-content .section[data-sec="route"]{grid-column:2;grid-row:1 / span 30;position:sticky;top:6px}
  #day-content .bottom-space{grid-column:1}
  .map-wrap #map{height:360px}
}
/* 天气扩展：日出日落 + 逐小时 */
.weather-main{display:flex;gap:14px;align-items:center;width:100%}
.wx-extra{display:flex;gap:14px;padding:0 16px 8px;font-size:12px;color:var(--secondary)}
.wx-hourly{display:flex;gap:12px;overflow-x:auto;padding:0 16px 10px;font-size:11px;color:var(--secondary);scrollbar-width:none}
.wx-hourly::-webkit-scrollbar{display:none}
.wx-h{text-align:center;flex:none;line-height:1.55}
.wx-h b{color:var(--label);font-weight:600}
.rain-row{display:flex;gap:6px;align-items:center;width:100%;text-align:left;font-size:12.5px;color:var(--tertiary);padding:8px 16px;position:relative}
.rain-row.has{color:var(--blue)}
.rain-row.rainy{color:var(--blue);font-weight:500}
.rain-row::before{content:"";position:absolute;left:16px;right:0;top:0;height:1px;background:var(--sep);transform:scaleY(.5)}

/* 深色模式：跟随系统或手动选择 */
[data-theme="dark"]{
  --bg:#000; --card:#1C1C1E; --label:#fff;
  --secondary:rgba(235,235,245,.6); --tertiary:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --blue:#0A84FF; --red:#FF453A; --fill:rgba(120,120,128,.28);
  --nav-bg:rgba(10,10,12,.9); --desk-bg:#0b0b0d; --fab-bg:rgba(44,44,46,.95);
  --num-bg:rgba(10,132,255,.22); --wx-bg:rgba(10,132,255,.18); --check-bd:rgba(235,235,245,.35); --as-bg:rgba(40,40,42,.96);
  --card-active:#2a2a2e;
  color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --card:#1C1C1E; --label:#fff;
    --secondary:rgba(235,235,245,.6); --tertiary:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
    --blue:#0A84FF; --red:#FF453A; --fill:rgba(120,120,128,.28);
    --nav-bg:rgba(10,10,12,.9); --desk-bg:#0b0b0d; --fab-bg:rgba(44,44,46,.95);
    --num-bg:rgba(10,132,255,.22); --wx-bg:rgba(10,132,255,.18); --check-bd:rgba(235,235,245,.35); --as-bg:rgba(40,40,42,.96);
    --card-active:#2a2a2e;
    color-scheme:dark;
  }
}
</style>
</head>
<body>
<div id="frame">

  <!-- 行程列表 -->
  <div id="screen-list" class="screen">

'use strict';
/* ============ 工具 ============ */
const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
const WEEK_CN = ['周日','周一','周二','周三','周四','周五','周六'];
function parseDate(s){ const p = String(s).split('-').map(Number); return new Date(p[0], (p[1]||1)-1, p[2]||1); }
function toISO(d){ const p = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fmtDay(s){ const d = parseDate(s); return (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function addDaysISO(n){ const d = new Date(); d.setDate(d.getDate()+n); return toISO(d); }
function genDates(startStr, endStr){
  const out = []; const day = 86400000;
  let t = parseDate(startStr).getTime(); const end = parseDate(endStr).getTime(); let n = 0;
  while (t <= end && n < 60){ out.push(toISO(new Date(t))); t += day; n++; }
  return out;
}
function daysBetween(a, b){ return Math.round((parseDate(b) - parseDate(a)) / 86400000) + 1; }
function tripRange(t){ return t.startDate === t.endDate ? fmtDay(t.startDate) : fmtDay(t.startDate) + ' – ' + fmtDay(t.endDate); }

/* ============ 数据 ============ */
const STORE_KEY = 'tp.trips.v1';
function emptyMeal(){ return { content:'', note:'', place:null }; }
function emptyDay(date){ return { date, stops:[], meals:{ breakfast:emptyMeal(), lunch:emptyMeal(), dinner:emptyMeal() }, notes:[], depart:'08:30', reservations:[] }; }
function makeTrip(o){
  const start = o.end && o.end < o.start ? o.end : o.start;
  const end = o.end && o.end < o.start ? o.start : o.end;
  return {
    id: uid(), name: (o.name||'').trim() || '未命名行程',
    destinationName: o.place ? o.place.name : '', destinationPlace: o.place || null,
    hotel: o.hotel || null,
    expenses: [], packing: [],
    startDate: o.start, endDate: end, createdAt: Date.now(),
    days: genDates(start, end).map(emptyDay)
  };
}
function regenerateDays(t){
  const dates = genDates(t.startDate, t.endDate);
  const old = new Map(t.days.map(d => [d.date, d]));
  t.days = dates.map(d => old.get(d) || emptyDay(d));
}
// 旧数据 / 导入数据统一补齐新字段
function migrateTrip(t){
  t.hotel = t.hotel || null;
  t.destinationPlace = t.destinationPlace || null;
  t.destinationName = t.destinationName || '';
  t.expenses = Array.isArray(t.expenses) ? t.expenses : [];
  t.packing = Array.isArray(t.packing) ? t.packing : [];
  if (!Array.isArray(t.days)) t.days = [];
  t.days.forEach(d => {
    d.depart = d.depart || '08:30';
    d.reservations = Array.isArray(d.reservations) ? d.reservations : [];
    d.notes = Array.isArray(d.notes) ? d.notes : [];
    d.stops = (d.stops || []).map(s => {
      s.id = s.id || uid();
      s.transit = s.transit || null;
      s.photos = Array.isArray(s.photos) ? s.photos : [];
      s.stay = Number(s.stay) || null;
      s.done = !!s.done;
      return s;
    });
    d.meals = Object.assign({ breakfast: emptyMeal(), lunch: emptyMeal(), dinner: emptyMeal() }, d.meals || {});
  });
  return t;
}
function loadTrips(){
  try {
    const arr = JSON.parse(localStorage.getItem(STORE_KEY)) || [];
    return arr.map(migrateTrip);
  } catch(e){ return []; }
}
function save(){
  const now = JSON.stringify(trips);
  if (now === lastSavedJson) return;
  // 每次真实变更前，把上一个状态存进撤回记录（1.5 秒内的连续输入合并为一条）
  if (!restoring && lastSavedJson !== null){
    const t = Date.now();
    if (t - lastHistoryAt > 1500 || !undoStack.length){
      undoStack.push({ ts: t, data: lastSavedJson });
      if (undoStack.length > 30) undoStack.shift();
      persistHistory();
      lastHistoryAt = t;
    }
  }
  lastSavedJson = now;
  try { localStorage.setItem(STORE_KEY, now); } catch(e){ console.warn('保存失败', e); }
}
let trips = loadTrips();

let currentTripId = null, dayIndex = 0, map = null, weatherToken = 0;

/* ============ 天气（Open-Meteo，免费无 Key） ============ */
function WMO(c){
  const table = [
    [0,'☀️','晴'],[1,'🌤️','基本晴'],[2,'⛅','多云'],[3,'☁️','阴'],[45,'🌫️','雾'],[48,'🌫️','雾'],
    [51,'🌦️','毛毛雨'],[53,'🌦️','毛毛雨'],[55,'🌧️','毛毛雨'],[56,'🌧️','冻毛毛雨'],[57,'🌧️','冻毛毛雨'],
    [61,'🌦️','小雨'],[63,'🌧️','中雨'],[65,'🌧️','大雨'],[66,'🌧️','冻雨'],[67,'🌧️','冻雨'],
    [71,'🌨️','小雪'],[73,'🌨️','中雪'],[75,'❄️','大雪'],[77,'🌨️','雪粒'],
    [80,'🌦️','阵雨'],[81,'🌧️','强阵雨'],[82,'🌧️','强阵雨'],[85,'🌨️','阵雪'],[86,'🌨️','阵雪'],
    [95,'⛈️','雷阵雨'],[96,'⛈️','雷阵雨伴冰雹'],[99,'⛈️','雷阵雨伴冰雹']
  ];
  const hit = table.find(m => m[0] === c);
  return { emoji: hit ? hit[1] : '☁️', text: hit ? hit[2] : '未知天气' };
}
async function fetchWeather(place, dateStr){
  const key = place.lat + ',' + place.lng + ',' + dateStr;
  if (weatherCache.has(key)) return weatherCache.get(key);
  try {
        const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + place.lat + '&longitude=' + place.lng
          + '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset'
          + '&hourly=temperature_2m,precipitation_probability'
          + '&timezone=auto&start_date=' + dateStr + '&end_date=' + dateStr;
        const res = await fetch(url);
        if (!res.ok) throw new Error('bad status');
        const j = await res.json(); const d = j.daily; const i = d.time.indexOf(dateStr);
        if (i < 0) throw new Error('no day');
        const hourly = [];
        if (j.hourly && j.hourly.time){
          j.hourly.time.forEach((t2, k) => {
            if (String(t2).slice(0, 10) !== dateStr) return;
            hourly.push({ h: Number(String(t2).slice(11, 13)), t: Math.round(j.hourly.temperature_2m[k]), p: (j.hourly.precipitation_probability && j.hourly.precipitation_probability[k] != null) ? j.hourly.precipitation_probability[k] : null });
          });
        }
        const w = Object.assign(
          { code: d.weather_code[i], tmax: d.temperature_2m_max[i], tmin: d.temperature_2m_min[i],
            precip: (d.precipitation_probability_max && d.precipitation_probability_max[i] != null) ? d.precipitation_probability_max[i] : null,
            wind: (d.wind_speed_10m_max && d.wind_speed_10m_max[i] != null) ? d.wind_speed_10m_max[i] : null,
            sunrise: (d.sunrise && d.sunrise[i]) ? String(d.sunrise[i]).slice(11, 16) : null,
            sunset: (d.sunset && d.sunset[i]) ? String(d.sunset[i]).slice(11, 16) : null,
            hourly: hourly },
          WMO(d.weather_code[i]));
    weatherCache.set(key, w);
    return w;
  } catch(e){ return null; }
}

/* ============ 地点搜索（Photon / Nominatim 兜底） ============ */
async function searchPlaces(q){
  q = q.trim();
  if (!q) return [];
  // 中文连写查询（如"杭州西湖"）自动拆成"城市 + 地点"再搜一次，命中率更高
  const variants = [q];
  if (/^[\u4e00-\u9fa5]{4,7}$/.test(q)) variants.push(q.slice(0, 2) + ' ' + q.slice(2));
  const parse = j => (j.features || []).filter(f => f.geometry && f.geometry.coordinates).map(f => {
    const p = f.properties || {};
    const title = p.name || [p.street, p.housenumber].filter(Boolean).join(' ') || p.city || p.county || '未命名地点';
    const addr = [p.street && p.housenumber ? p.street + ' ' + p.housenumber : p.street, p.city || p.county, p.state, p.country]
      .filter(Boolean).join(', ');
    return { name: title, address: addr === title ? '' : addr, lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
  });
  const batches = await Promise.all(variants.map(v =>
    fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(v) + '&limit=6')
      .then(r => r.json()).then(parse).catch(() => [])
  ));
  let ordered = batches[0];
  if (batches.length > 1) ordered = batches[1].concat(batches[0]);
  const seen = new Set();
  const out = [];
  for (const r of ordered) {
    const key = r.lat.toFixed(3) + ',' + r.lng.toFixed(3);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(r);
    if (out.length >= 10) break;
  }
  return out;
}
async function reverseGeocode(lat, lng){
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=' + lat + '&lon=' + lng + '&zoom=18&accept-language=zh-CN');
    const j = await r.json();
    const name = j.name || String(j.display_name || '').split(',')[0] || '我的位置';
    const w = gcj2wgs(lat, lng);
    return { name: name, address: j.display_name || '', lat: w.lat, lng: w.lng };
  } catch(e){
    const w = gcj2wgs(lat, lng);
    return { name: '我的位置', address: '', lat: w.lat, lng: w.lng };
  }
}

/* --- 天气 --- */
function weatherPlaceOf(t, day){ return t.destinationPlace || (day.stops[0] && day.stops[0].place) || null; }

}
function weatherHTML(w){
  let html = '<div class="weather-main">'
    + '<div class="weather-icon">' + w.emoji + '</div>'
    + '<div class="weather-info">'
    + '<div class="weather-cond">' + esc(w.text) + '</div>'
    + '<div class="weather-sub"><b>' + Math.round(w.tmax) + '°</b> / ' + Math.round(w.tmin) + '°'
    + (w.precip != null && w.precip > 0 ? ' · 💧' + w.precip + '%' : '')
    + (w.wind != null && w.wind >= 1 ? ' · 🍃' + Math.round(w.wind) + 'km/h' : '')
    + '</div></div></div>';
  if (w.sunrise || w.sunset){
    html += '<div class="wx-extra"><span>🌅 日出 ' + (w.sunrise || '--') + '</span><span>🌇 日落 ' + (w.sunset || '--') + '</span></div>';
  }
  if (w.hourly && w.hourly.length){
    html += '<div class="wx-hourly">' + w.hourly.map(it =>
      '<span class="wx-h">' + it.h + '时<br><b>' + it.t + '°</b>' + (it.p != null && it.p >= 20 ? '<br>💧' + it.p + '%' : '') + '</span>'
    ).join('') + '</div>';
  }
  return html;
}
async function loadWeatherInto(t, day){
  const place = weatherPlaceOf(t, day);
  if (!place) return;
  const key = place.lat + ',' + place.lng + ',' + day.date;
  const el = () => document.getElementById('weather-card');
  const apply = (w) => {
    const node = el();
    if (!node) return;
    node.innerHTML = w ? weatherHTML(w) : '<div class="hint">☁️ 暂无该日期的天气数据（通常超出未来 16 天的预报范围）</div>';
    const ra = document.getElementById('rain-add');
    if (ra){
      const rainy = w && w.code >= 51;
      ra.textContent = rainy ? '☔ 今天有雨，点此安排室内备选方案' : '☔ 添加雨天备选方案';
      ra.classList.toggle('rainy', !!rainy);
    }
  };
  if (weatherCache.has(key)){
    const w = weatherCache.get(key);
    apply(w);
    return;
  }
  const token = ++weatherToken;
  const w = await fetchWeather(place, day.date);
  if (token !== weatherToken) return;
  apply(w);
}

function transitSummary(tr){
  if (!tr) return '';
  const m = TRANSIT_META[tr.mode] || TRANSIT_META.other;
  const parts = [m.emoji + ' ' + m.title + (tr.line ? ' ' + tr.line : '')];
  if (tr.from && tr.to) parts.push(tr.from + ' → ' + tr.to);
  else if (tr.from) parts.push('从 ' + tr.from);
  else if (tr.to) parts.push('到 ' + tr.to);
  if (tr.exit) parts.push(tr.exit + '出');
  if (tr.walkAfter) parts.push('出站' + tr.walkAfter);
  if (tr.minutes) parts.push('约' + tr.minutes + '分钟');
  if (tr.distText) parts.push(tr.distText);
  if (tr.note) parts.push(tr.note);
  return parts.join(' · ');
}
function distText(p1, p2, mode){
  const m = Math.round(haversineKm(p1.lat, p1.lng, p2.lat, p2.lng) * 1000);
  if (mode === 'walk') return '约' + m + '米';
  return '约' + (m / 1000).toFixed(1) + '公里';
}

// 坐标转换：搜索结果是 WGS-84，高德/百度在国内用 GCJ-02（火星坐标），不转换导航会偏几百米
function outOfChina(lat, lng){ return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271; }
function wgs2gcj(lat, lng){
  if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
  const a = 6378245.0, ee = 0.00669342162296594323;
  function tLat(x, y){
    let r = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2 / 3;
    r += (20*Math.sin(y*Math.PI) + 40*Math.sin(y/3*Math.PI)) * 2 / 3;
    r += (160*Math.sin(y/12*Math.PI) + 320*Math.sin(y*Math.PI/30)) * 2 / 3;
    return r;
  }
  function tLng(x, y){
    let r = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    r += (20*Math.sin(6*x*Math.PI) + 20*Math.sin(2*x*Math.PI)) * 2 / 3;
    r += (20*Math.sin(x*Math.PI) + 40*Math.sin(x/3*Math.PI)) * 2 / 3;
    r += (150*Math.sin(x/12*Math.PI) + 300*Math.sin(x/30*Math.PI)) * 2 / 3;
    return r;
  }
  const radLat = lat / 180 * Math.PI;
  let magic = Math.sin(radLat); magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  dLng = (dLng * 180) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return { lat: lat + dLat, lng: lng + dLng };
}
function gcj2wgs(lat, lng){
  const g = wgs2gcj(lat, lng);
  return { lat: lat - (g.lat - lat), lng: lng - (g.lng - lng) };
}

/* --- 地图 --- */
function destroyMap(){ if (map){ try { map.remove(); } catch(e){} map = null; } }
let mapLocked = true;
function applyMapLock(){
  if (!map) return;
  const method = mapLocked ? 'disable' : 'enable';
  ['dragging', 'scrollWheelZoom', 'doubleClickZoom', 'boxZoom', 'keyboard', 'touchZoom'].forEach(k => {
    if (map[k] && map[k][method]) map[k][method]();
  });
}
function fitRoute(){
  if (!map) return;
  const t = getTrip(currentTripId); if (!t) return;
  const day = t.days[dayIndex]; if (!day) return;
  const pts = day.stops.map(s => [s.place.lat, s.place.lng]).concat(t.hotel ? [[t.hotel.lat, t.hotel.lng]] : []);
  if (!pts.length) return;
  if (pts.length === 1) map.setView(pts[0], 14);
  else map.fitBounds(L.latLngBounds(pts), { padding: [36, 36], maxZoom: 15 });
}
function setupMap(day, hotel){
  const el = document.getElementById('map');
  if (!el) return;
  if (typeof L === 'undefined'){ el.innerHTML = '<div class="map-fallback">地图组件加载中或不可用（需要联网）</div>'; return; }
  destroyMap();
  map = L.map(el, { zoomControl:false });
  el._mapInstance = map;
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16, attribution:'© Esri, HERE, Garmin'
  }).addTo(map);
  const stops = day.stops;
  if (stops.length >= 2) {
    L.polyline(stops.map(s => [s.place.lat, s.place.lng]), {
      color:'#007AFF', weight:4, opacity:0.9, lineCap:'round', lineJoin:'round'
    }).addTo(map);
  }
  stops.forEach((s, i) => {
    const icon = L.divIcon({ className:'pin-outer', html:'<div class="pin">' + (i+1) + '</div>', iconSize:[28,28], iconAnchor:[14,14] });
    L.marker([s.place.lat, s.place.lng], { icon }).addTo(map).bindTooltip(s.place.name, { direction:'top', offset:[0,-16] });
  });
  if (hotel){
    const hIcon = L.divIcon({ className:'pin-outer', html:'<div class="pin hotel">🏨</div>', iconSize:[28,28], iconAnchor:[14,14] });
    L.marker([hotel.lat, hotel.lng], { icon: hIcon }).addTo(map).bindTooltip('酒店：' + hotel.name, { direction:'top', offset:[0,-16] });
  }
  const allPts = stops.map(s => [s.place.lat, s.place.lng]).concat(hotel ? [[hotel.lat, hotel.lng]] : []);
  if (allPts.length === 1){
    map.setView(allPts[0], 14);
  } else if (allPts.length > 1){
    map.fitBounds(L.latLngBounds(allPts), { padding:[36,36], maxZoom:15 });
  } else {
    map.setView([35, 105], 4);
  }
  applyMapLock();
  setTimeout(() => { if (map) map.invalidateSize(); }, 280);
}

// MARK: 交通段编辑（从上一站到本站怎么走）
function estimateMinutes(mode, a, b, c, d){
  const km = haversineKm(a, b, c, d) * 1.35;
  if (mode === 'walk') return Math.max(3, Math.round(km / 4.8 * 60));
  if (mode === 'bike') return Math.max(3, Math.round(km / 12 * 60));
  if (mode === 'taxi' || mode === 'drive') return Math.max(6, Math.round(km / 22 * 60) + 5);
  if (mode === 'bus' || mode === 'metro') return Math.max(12, Math.round(km / 20 * 60) + 10);
  return null;
}
// 高德 Web 服务 API：真实路线规划（公交/地铁/步行/驾车）
const AMAP_KEY = '9014bd89ecf2dca2a987cd824cd3ccb7';
function amapKey(){ return localStorage.getItem('tp.amapkey') || AMAP_KEY; }
function amapJSONP(url){
  return new Promise((resolve, reject) => {
    const cb = 'amapcb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('请求超时')); }, 15000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('网络错误')); };
    s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}
async function amapPlanFill(){
  if (!transitCtx || !transitCtx.fromPlace || !transitCtx.toPlace){ showToast('请先选择交通方式'); return; }
  const t0 = getTrip(currentTripId); if (!t0) return;
  const f = wgs2gcj(transitCtx.fromPlace.lat, transitCtx.fromPlace.lng);
  const g = wgs2gcj(transitCtx.toPlace.lat, transitCtx.toPlace.lng);
  const md = transitCtx.draft.mode;
  const city = encodeURIComponent(t0.destinationName || '长沙');
  const key = amapKey();
  showToast('正在向高德查询真实路线…');
  try {
    if (md === 'metro' || md === 'bus'){
      const resp = await amapJSONP('https://restapi.amap.com/v3/direction/transit/integrated?origin=' + f.lng + ',' + f.lat + '&destination=' + g.lng + ',' + g.lat + '&city=' + city + '&strategy=0&key=' + key);
      if (String(resp.status) !== '1') throw new Error(resp.info || '查询失败');
      const trs = (resp.route && resp.route.transits) || [];
      if (!trs.length) throw new Error('两地之间没有查到公共交通方案');
      const tr = trs[0];
      transitCtx.draft.minutes = Math.max(1, Math.round((Number(tr.duration) || 0) / 60));
      let line = '', from = '', to = '', walkAfter = '';
      (tr.segments || []).forEach(seg => {
        if (seg.bus && seg.bus.buslines && seg.bus.buslines.length){
          const bl = seg.bus.buslines[0];
          line = line ? line + ' 转 ' + bl.name : bl.name;
          if (!from && bl.departure_stop) from = bl.departure_stop.name || '';
          if (bl.arrival_stop) to = bl.arrival_stop.name || to;
        }
        if (seg.walking && Number(seg.walking.distance) > 30){
          walkAfter = '步行约' + Math.round(Number(seg.walking.distance)) + '米';
        }
      });
      if (line) transitCtx.draft.line = line;
      if (from) transitCtx.draft.from = from;
      if (to) transitCtx.draft.to = to;
      if (walkAfter) transitCtx.draft.walkAfter = walkAfter;
      openTransitEdit(transitCtx.stopIndex, transitCtx.draft);
      showToast('已按高德方案自动填入 ✓');
    } else if (md === 'walk' || md === 'taxi' || md === 'drive'){
      const api = (md === 'walk')
        ? 'https://restapi.amap.com/v3/direction/walking?origin=' + f.lng + ',' + f.lat + '&destination=' + g.lng + ',' + g.lat
        : 'https://restapi.amap.com/v3/direction/driving?origin=' + f.lng + ',' + f.lat + '&destination=' + g.lng + ',' + g.lat + '&extensions=base';
      const resp = await amapJSONP(api + '&key=' + key);
      if (String(resp.status) !== '1') throw new Error(resp.info || '查询失败');
      const path = resp.route && resp.route.paths && resp.route.paths[0];
      if (!path) throw new Error('没有查到路线');
      transitCtx.draft.minutes = Math.max(1, Math.round((Number(path.duration) || 0) / 60));
      transitCtx.draft.distM = Math.round(Number(path.distance) || 0);
      openTransitEdit(transitCtx.stopIndex, transitCtx.draft);
      showToast('已按高德方案自动填入 ✓');
    } else {
      showToast('该方式暂用自动估算');
    }
  } catch(e){
    let msg = '查询失败：' + e.message;
    if (String(e.message).indexOf('KEY') >= 0 || String(e.message).indexOf('USERKEY') >= 0) msg = '查询失败：高德Key无效或类型不对（需创建「Web服务」类型Key）';
    showToast(msg);
  }
}

      if (!ctx) break;
      if (!document.body.classList.contains('detail-open') && getTrip(ctx.tripId)){
        currentTripId = ctx.tripId;
        document.body.classList.add('detail-open');
        renderDetail();
      }
      openPackingSheet();
      break;
    }
    case 'as-export': {
      const ctx = asCtx; closeActionSheet();
      if (!ctx) break;
      const trip = getTrip(ctx.tripId);
      if (trip) openExportSheet(trip);
      break;
    }
    case 'import-trips': openImportSheet(null); break;
    case 'import-url': {
      const u = ($('#imp-url') ? $('#imp-url').value : '').trim();
      if (u) doImportUrl(u);
      break;
    }
    case 'import-text': {
      const txt = $('#imp-text') ? $('#imp-text').value : '';
      try {
        const arr = normalizeImportedTrips(JSON.parse(txt));
        if (!arr.length) throw new Error('empty');
        importTrips(arr);
      } catch (e) { showImportError('JSON 格式不正确，请检查后重试'); }
      break;
    }
    case 'as-edit': {
      const ctx = asCtx; closeActionSheet();
      if (ctx) openTripForm(getTrip(ctx.tripId));
      break;
    }
    case 'as-delete-confirm':
      showActionSheet(
        [{ label:'删除后将无法恢复', sub:true }, { label:'删除行程', act:'as-delete-final', danger:true }],
        asCtx);
      break;
    case 'as-delete-final': {
      const ctx = asCtx; closeActionSheet();
      if (ctx){
        const i = trips.findIndex(x => x.id === ctx.tripId);
        if (i >= 0) trips.splice(i, 1);
        save();
        if (ctx.fromDetail || currentTripId === ctx.tripId) backToList(); else renderList();
      }
      break;
    }
    case 'as-dismiss': closeActionSheet(); break;

    /* 表单 */
    case 'sheet-cancel': closeSheet(); break;
    case 'open-destination':
      openPlacePicker('选择目的地', place => {
        if (!formState) return;
        formState.place = place;
        const sp = $('#f-place');
        if (sp){ sp.textContent = place.name; sp.classList.remove('placeholder'); }
      });
      break;
    case 'save-trip': saveTrip(); break;

    /* 路线 */
    case 'add-stop':
      openPlacePicker('添加路线地点', place => {
        const tt = getTrip(currentTripId);
        if (!tt) return;
        tt.days[dayIndex].stops.push({ id: uid(), place });
        save(); renderDetail();
      });
      break;
    case 'stop-up': case 'stop-down': {
      if (!t) break;
      const i = +el.dataset.i, j = act === 'stop-up' ? i - 1 : i + 1;
      const stops = t.days[dayIndex].stops;
      if (j < 0 || j >= stops.length) break;
      const tmp = stops[i]; stops[i] = stops[j]; stops[j] = tmp;
      save(); renderDetail();
      break;
    }
    case 'stop-del':
      if (!t) break;
      t.days[dayIndex].stops.splice(+el.dataset.i, 1);
      save(); renderDetail();
      break;

    /* 撤回 / 操作记录 */
    case 'undo': doUndo(); break;
    case 'open-history': openHistorySheet(); break;
    case 'theme-toggle': cycleTheme(); break;
    case 'guide-dist': requestGuideDist(); break;
    case 'rain-edit': {
      const t2 = getTrip(currentTripId);
      if (!t2 || !t2.days[dayIndex]) break;
      openRainSheet(t2.days[dayIndex]);
      break;
    }
    case 'rain-save': {
      if (!t) break;
      const txt = $('#rain-text') ? $('#rain-text').value.trim() : '';
      t.days[dayIndex].rainPlan = txt || null;
      save(); closeSheet(); renderDetail();
      if (txt) showToast('雨天备选方案已保存');
      break;
    }
    case 'around': {
      const g = wgs2gcj(+el.dataset.lat, +el.dataset.lng);
      location.href = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(el.dataset.kw) + '&center=' + g.lng + ',' + g.lat + '&src=travelplan&coordinate=gaode';
      break;
    }
    case 'backup': openBackupSheet(); break;
    case 'backup-restore': {
      const txt = $('#bk-text') ? $('#bk-text').value : '';
      try {
        const arr = JSON.parse(txt);
        if (!Array.isArray(arr) || !arr.length) throw new Error('empty');
        undoStack.push(snapNow());
        if (undoStack.length > 30) undoStack.shift();
        persistHistory();
        trips = arr.map(migrateTrip);
        restoring = true; save(); restoring = false;
        renderList();
        if (document.body.classList.contains('detail-open')){
          if (getTrip(currentTripId)) renderDetail(); else backToList();
        }
        closeSheet();
        showToast('已恢复 ' + trips.length + ' 个行程');
      } catch (e) { showToast('恢复失败：内容格式不对'); }
      break;
    }
    case 'history-restore': {
      const idx = +el.dataset.i;
      if (!(idx >= 0 && idx < undoStack.length)) break;
      const entry = undoStack[idx];
      undoStack = undoStack.slice(0, idx);
      persistHistory();
      closeSheet();
      applyState(entry.data);
      showToast('已恢复到 ' + timeAgo(entry.ts) + ' 的状态');
      break;
    }

    /* 时间轴 / 向导 / 预算 / 打包 / 预约 */
    case 'open-guide': openGuide(); break;
    case 'guide-nav': {
      if (!t) break;
      const stop = t.days[dayIndex].stops[+el.dataset.i];
      if (stop) openNav(stop.place);
      break;
    }
    case 'guide-check': {
      if (!t) break;
      const stop = t.days[dayIndex].stops[+el.dataset.i];
      if (stop){ stop.done = true; save(); }
      renderGuide(); renderDetail();
      break;
    }
    case 'guide-toggle': {
      if (!t) break;
      const stop = t.days[dayIndex].stops[+el.dataset.i];
      if (stop){ stop.done = !stop.done; save(); }
      renderGuide(); renderDetail();
      break;
    }
    case 'expense-add': openExpenseSheet(); break;
    case 'expense-cat': {
      expenseCat = el.dataset.cat;
      document.querySelectorAll('[data-act="expense-cat"]').forEach(b => b.classList.toggle('active', b.dataset.cat === expenseCat));
      break;
    }
    case 'expense-save': {
      if (!t) break;
      const amt = parseFloat($('#e-amt') ? $('#e-amt').value : '') || 0;
      const note = $('#e-note') ? $('#e-note').value.trim() : '';
      t.expenses.push({ id: uid(), day: t.days[dayIndex].date, cat: expenseCat, amount: amt, note: note });
      save(); closeSheet(); renderDetail();
      showToast('已记一笔 ¥' + amt);
      break;
    }
    case 'expense-del': {
      if (!t) break;
      t.expenses = t.expenses.filter(x => x.id !== el.dataset.id);
      save(); renderDetail();
      break;
    }
    case 'open-packing': openPackingSheet(); break;
    case 'as-packing': {
      const ctx = asCtx; closeActionSheet();
      if (!ctx) break;
      if (!document.body.classList.contains('detail-open') && getTrip(ctx.tripId)){
        currentTripId = ctx.tripId;
        document.body.classList.add('detail-open');
        renderDetail();
      }
      openPackingSheet();
      break;
    }
    case 'packing-toggle': {
      const t2 = getTrip(currentTripId); if (!t2) break;
      const item = t2.packing.find(x => x.id === el.dataset.id);
      if (item){ item.done = !item.done; save(); }
      openPackingSheet();
      break;
    }
    case 'packing-del': {
      const t2 = getTrip(currentTripId); if (!t2) break;
      t2.packing = t2.packing.filter(x => x.id !== el.dataset.id);
      save(); openPackingSheet();
      break;
    }
    case 'packing-cat': {
      packingCat = el.dataset.cat;
      document.querySelectorAll('[data-act="packing-cat"]').forEach(b => b.classList.toggle('active', b.dataset.cat === packingCat));
      break;
    }
    case 'packing-add': {
      const row = $('#packing-add-row');
      if (!row) break;
      const opening = row.style.display === 'none';
      row.style.display = opening ? 'block' : 'none';
      const btn = document.querySelector('[data-act="packing-add"]');
      if (btn) btn.textContent = opening ? '✓ 加入清单' : '＋ 添加物品';
      const inp = $('#p-text');
      if (opening && inp){ inp.focus(); }
      else if (inp && inp.value.trim()){ addPackingItem(inp.value, packingCat); }
      break;
    }
    case 'packing-template': {
      const t2 = getTrip(currentTripId); if (!t2) break;
      Object.keys(PACK_TEMPLATE).forEach(cat => {
        PACK_TEMPLATE[cat].forEach(text => {
          if (!t2.packing.some(x => x.text === text)) t2.packing.push({ id: uid(), text: text, done: false, cat: cat });
        });
      });
      save(); openPackingSheet(); showToast('已生成常用模板，勾掉不需要的就行');
      break;
    }
    case 'packing-clear': {
      const t2 = getTrip(currentTripId); if (!t2) break;
      t2.packing = t2.packing.filter(x => !x.done);
      save(); openPackingSheet();
      break;
    }
    case 'resv-add': openResvSheet(); break;
    case 'resv-save': {
      if (!resvCtx || !t) break;
      const d = resvCtx.draft;
      if (!d.title.trim()){ showToast('先填写预约内容'); break; }
      t.days[resvCtx.dayIndex].reservations.push({ id: uid(), title: d.title.trim(), slot: d.slot.trim(), code: d.code.trim(), platform: d.platform.trim() });
      save(); resvCtx = null; closeSheet(); renderDetail();
      showToast('预约已添加');
      break;
    }
    case 'resv-del': {
      if (!t) break;
      t.days[dayIndex].reservations = t.days[dayIndex].reservations.filter(x => x.id !== el.dataset.id);
      save(); renderDetail();
      break;
    }

    /* 导航 */
    case 'stop-detail': {
      if (!t) break;
      const i3 = +el.dataset.i;
      const stop = t.days[dayIndex].stops[i3];
      if (stop) openStopDetail(stop, i3);
      break;
    }
    case 'map-fit': fitRoute(); break;
    case 'map-lock': {
      mapLocked = !mapLocked;
      localStorage.setItem('tp.maplock', mapLocked ? 'on' : 'off');
      applyMapLock();
      const row = document.querySelector('.map-ctrl .map-btn[data-act="map-lock"]');
      if (row){
        row.classList.toggle('on', mapLocked);
        row.innerHTML = mapLocked ? LOCK_SVG : UNLOCK_SVG;
      }
      showToast(mapLocked ? '地图已锁定，可放心滑动页面' : '地图已解锁，可以拖动探索');
      break;
    }
    case 'hotel-detail': {
      if (!t || !t.hotel) break;
      openHotelDetail(t.hotel, dayIndex);
      break;
    }
    case 'stop-photo': {
      if (!t) break;
      const stop = t.days[dayIndex].stops[+el.dataset.i];
      if (stop && stop.photos && stop.photos.length) openPhotoSheet(stop);
      break;
    }
    case 'hotel-nav': {
      if (!t || !t.hotel) break;
      openNav(t.hotel);
      break;
    }
    case 'open-hotel':
      openPlacePicker('选择酒店', p => {
        if (!formState) return;
        formState.hotel = p;
        const sp = $('#f-hotel');
        if (sp){ sp.textContent = p.name; sp.classList.remove('placeholder'); }
        const cb = $('#clear-hotel-btn');
        if (cb) cb.style.display = 'flex';
      });
      break;
    case 'clear-hotel': {
      if (formState) formState.hotel = null;
      const sp = $('#f-hotel');
      if (sp){ sp.textContent = '选填，行程从这里出发'; sp.classList.add('placeholder'); }
      const cb = $('#clear-hotel-btn');
      if (cb) cb.style.display = 'none';
      break;
    }
    case 'stop-nav': {
      if (!t) break;
      const stop = t.days[dayIndex].stops[+el.dataset.i];
      if (stop) openNav(stop.place);
      break;
    }
    case 'nav-amap': {
      const p = asCtx && asCtx.navPlace; closeActionSheet();
      if (!p) break;
      const g = wgs2gcj(p.lat, p.lng);
      location.href = 'https://uri.amap.com/navigation?to=' + g.lng + ',' + g.lat + '&mode=car&policy=1&src=travelplan&coordinate=gaode&callnative=1';
      break;
    }
    case 'nav-baidu': {
      const p = asCtx && asCtx.navPlace; closeActionSheet();
      if (!p) break;
      location.href = 'https://api.map.baidu.com/direction?destination=latlng:' + p.lat + ',' + p.lng + '&coord_type=wgs84&mode=driving&output=html&src=travelplan';
      break;
    }
    case 'nav-apple': {
      const p = asCtx && asCtx.navPlace; closeActionSheet();
      if (!p) break;
      location.href = 'https://maps.apple.com/?daddr=' + p.lat + ',' + p.lng + '&dirflg=d';
      break;
    }

    /* 交通段 */
    case 'transit-edit': {
      if (!t) break;
      const i2 = +el.dataset.i;
      const stop = t.days[dayIndex].stops[i2];
      if (!stop) break;
      openTransitEdit(i2, stop.transit || null);
      break;
    }
    case 'transit-auto': amapPlanFill(); break;
    case 'transit-mode': {
      if (!transitCtx) break;
      transitCtx.draft.mode = el.dataset.mode;
      const fp = transitCtx.fromPlace, tp = transitCtx.toPlace;
      const doorToDoor = ['walk', 'bike', 'taxi', 'drive'].indexOf(transitCtx.draft.mode) >= 0;
      if (doorToDoor){
        if (!transitCtx.draft.from && fp) transitCtx.draft.from = fp.name;
        if (!transitCtx.draft.to && tp) transitCtx.draft.to = tp.name;
      } else {
        transitCtx.draft.from = '';
        transitCtx.draft.to = '';
      }
      if (fp && tp){
        const est = estimateMinutes(transitCtx.draft.mode, fp.lat, fp.lng, tp.lat, tp.lng);
        if (est) transitCtx.draft.minutes = est;
      }
      openTransitEdit(transitCtx.stopIndex, transitCtx.draft);
      break;
    }
    case 'transit-amap': {
      if (!transitCtx || !transitCtx.fromPlace || !transitCtx.toPlace) break;
      const f = wgs2gcj(transitCtx.fromPlace.lat, transitCtx.fromPlace.lng);
      const g = wgs2gcj(transitCtx.toPlace.lat, transitCtx.toPlace.lng);
      const md = transitCtx.draft.mode;
      const am = (md === 'walk') ? 'walk' : (md === 'bike') ? 'ride' : (md === 'bus' || md === 'metro') ? 'bus' : 'car';
      location.href = 'https://uri.amap.com/navigation?from=' + f.lng + ',' + f.lat + '&to=' + g.lng + ',' + g.lat + '&mode=' + am + '&policy=&src=travelplan&coordinate=gaode&callnative=1';
      break;
    }
    case 'transit-metro-find': {
      if (!transitCtx || !transitCtx.fromPlace) break;
      const f = wgs2gcj(transitCtx.fromPlace.lat, transitCtx.fromPlace.lng);
      const kw = transitCtx.draft.mode === 'bus' ? '公交站' : '地铁站';
      location.href = 'https://uri.amap.com/search?keyword=' + encodeURIComponent(kw) + '&center=' + f.lng + ',' + f.lat + '&src=travelplan&coordinate=gaode';
      break;
    }
    case 'transit-save': {
      if (!transitCtx || !t) break;
      const stop = t.days[dayIndex].stops[transitCtx.stopIndex];
      if (stop){
        const d = transitCtx.draft;
        const tr = {
          mode: d.mode,
          line: (d.line || '').trim(),
          from: (d.from || '').trim(),
          to: (d.to || '').trim(),
          minutes: parseInt(d.minutes, 10) || null,
          exit: (d.exit || '').trim(),
          walkAfter: (d.walkAfter || '').trim(),
          note: (d.note || '').trim()
        };
        stop.transit = (tr.line || tr.from || tr.to || tr.minutes || tr.exit || tr.walkAfter || tr.note) ? tr : null;
        save();
      }
      transitCtx = null; closeSheet(); renderDetail();
      break;
    }
    case 'transit-clear': {
      if (transitCtx && t){
        const stop = t.days[dayIndex].stops[transitCtx.stopIndex];
        if (stop){ stop.transit = null; save(); }
      }
      transitCtx = null; closeSheet(); renderDetail();
      break;
    }

    /* 三餐 */
    case 'meal-edit': openMealEdit(el.dataset.type); break;
    case 'open-meal-place':
      openPlacePicker('选择用餐地点', place => {
        if (!mealCtx) return;
        mealCtx.meal.place = place;
        save();
        const sp = $('#m-place');
        if (sp){ sp.textContent = place.name; sp.classList.remove('placeholder'); }
      });
      break;
    case 'meal-nav': {
      if (!mealCtx || !mealCtx.meal.place) break;
      openNav(mealCtx.meal.place);
      break;
    }
    case 'clear-meal-place':
      if (mealCtx){ mealCtx.meal.place = null; save(); openMealEdit(mealCtx.type); }
      break;
    case 'save-meal': saveMeal(); break;

    /* 备注 */
    case 'pick-cat': noteCat = el.dataset.cat; renderDetail(); break;
    case 'add-note': addNote(); break;
    case 'note-toggle': {
      if (!t) break;
      const n = t.days[dayIndex].notes.find(x => x.id === el.dataset.id);
      if (n){ n.isDone = !n.isDone; save(); renderDetail(); }
      break;
    }
    case 'note-del':
      if (!t) break;
      t.days[dayIndex].notes = t.days[dayIndex].notes.filter(x => x.id !== el.dataset.id);
      save(); renderDetail();
      break;
    case 'note-place': {
      if (!t) break;
      const note = t.days[dayIndex].notes.find(x => x.id === el.dataset.id);
      if (!note) break;
      if (!note.place){
        openPlacePicker('附加定位', p => { note.place = p; save(); renderDetail(); });
      } else {
        showActionSheet(
          [{ label: '更换定位', act: 'note-replace' }, { label: '清除定位', act: 'note-clear', danger: true }],
          { noteId: note.id });
      }
      break;
    }
    case 'note-replace': {
      const nid = asCtx && asCtx.noteId; closeActionSheet();
      if (!t || !nid) break;
      const note = t.days[dayIndex].notes.find(x => x.id === nid);
      if (note) openPlacePicker('更换定位', p => { note.place = p; save(); renderDetail(); });
      break;
    }
    case 'note-clear': {
      const nid = asCtx && asCtx.noteId; closeActionSheet();
      if (!t || !nid) break;
      const note = t.days[dayIndex].notes.find(x => x.id === nid);
      if (note){ note.place = null; save(); renderDetail(); }
      break;
    }
    case 'note-nav': {
      if (!t) break;
      const note = t.days[dayIndex].notes.find(x => x.id === el.dataset.id);
      if (note && note.place) openNav(note.place);
      break;
    }

    /* 地点选择器 */
    case 'picker-cancel': closePicker(); break;
    case 'backdrop-click': closeSheet(); break;
    case 'backdrop2-click': closePicker(); break;
    case 'use-location': useMyLocation(); break;
    case 'pick-suggestion': {
      if (!pickCtx) break;
      const r = pickCtx.results[+el.dataset.i];
      const cb = pickCtx.onPick;
      closePicker();
      if (r && cb) cb({ name: r.name, address: r.address, lat: r.lat, lng: r.lng });
      break;
    }
  }
});

/* ============ 撤回 / 操作记录 ============ */
const THEME_ICONS = {
  auto: '<svg width="21" height="21" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>',
  light: '<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>',
  dark: '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 14.2A8.8 8.8 0 0 1 9.8 3.4a9 9 0 1 0 10.8 10.8z"/></svg>'
};
function applyTheme(){
  const pref = localStorage.getItem('tp.theme') || 'auto';
  if (pref === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', pref);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.innerHTML = THEME_ICONS[pref] || THEME_ICONS.auto;
}
function cycleTheme(){
  const order = ['auto', 'light', 'dark'];
  const cur = localStorage.getItem('tp.theme') || 'auto';
  const next = order[(order.indexOf(cur) + 1) % 3];
  localStorage.setItem('tp.theme', next);
  applyTheme();
  showToast('外观：' + (next === 'auto' ? '跟随系统' : next === 'light' ? '浅色' : '深色'));
}
function openBackupSheet(){
  const json = JSON.stringify(trips);
  openSheet(
    '<div class="sheet-nav"><div class="sheet-title">备份与恢复</div><button class="nav-btn" data-act="sheet-cancel">关闭</button></div>'
    + '<button class="primary-btn" id="backup-copy" data-act="backup-copy">📋 复制全部数据</button>'
    + '<button class="primary-btn" id="backup-download" data-act="backup-download" style="background:var(--card);color:var(--blue)">⬇️ 下载备份文件</button>'
    + '<div class="card form-card" style="margin-top:14px"><div class="form-row col"><label>恢复：粘贴备份内容</label><textarea id="bk-text" class="import-area" placeholder="粘贴之前备份的 JSON"></textarea></div></div>'
    + '<button class="primary-btn" data-act="backup-restore">从粘贴内容恢复（覆盖现有行程）</button>'
    + '<div class="form-foot" style="margin:10px 20px 12px">备份包含全部行程、花费与清单；误恢复可在左下角 ↩ 撤回</div>');
  $('#backup-copy').addEventListener('click', async () => {
    const btn = $('#backup-copy');
    try { await navigator.clipboard.writeText(json); btn.textContent = '已复制 ✓'; }
    catch(e){ btn.textContent = '复制失败，请用下载或手动全选'; }
  });
  $('#backup-download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'travelplan-backup-' + toISO(new Date()) + '.json';
    a.click();
  });
}
function persistHistory(){
  try { localStorage.setItem('tp.history.v1', JSON.stringify({ s: undoStack, r: redoStack })); } catch(e){}
}
function snapNow(){ return JSON.stringify(trips); }
function applyState(stateJson){
  redoStack.push(snapNow());
  if (redoStack.length > 30) redoStack.shift();
  trips = JSON.parse(stateJson);
  persistHistory();
  restoring = true; save(); restoring = false;
  renderList();
  if (document.body.classList.contains('detail-open')){
    if (getTrip(currentTripId)) renderDetail(); else backToList();
  }
}
function doUndo(){
  if (!undoStack.length){ showToast('没有可撤回的操作'); return; }
  const entry = undoStack.pop();
  persistHistory();
  applyState(entry.data);
  showToast('已撤回到 ' + timeAgo(entry.ts) + ' 的状态');
}
function doRedo(){
  if (!redoStack.length){ showToast('没有可重做的操作'); return; }
  const entry = redoStack.pop();
  undoStack.push(snapNow());
  persistHistory();
  trips = JSON.parse(entry.data);
  persistHistory();
  restoring = true; save(); restoring = false;
  renderList();
  if (document.body.classList.contains('detail-open')){
    if (getTrip(currentTripId)) renderDetail(); else backToList();
  }
  showToast('已重做');
}
function timeAgo(ts){
  const d = Date.now() - ts;
  if (d < 60000) return '刚刚';
  if (d < 3600000) return Math.floor(d / 60000) + ' 分钟前';
  if (d < 86400000) return Math.floor(d / 3600000) + ' 小时前';
  const dt = new Date(ts);
  return (dt.getMonth() + 1) + '月' + dt.getDate() + '日 ' + String(dt.getHours()).padStart(2, '0') + ':' + String(dt.getMinutes()).padStart(2, '0');
}
function showToast(msg){
  let t = document.getElementById('toast');
  if (!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============ 时间轴排程 ============ */
function toMin(hhmm){ const p = String(hhmm || '').split(':'); return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0); }
function fmtMin(m){ m = Math.max(0, Math.round(m)); const h = Math.floor(m / 60) % 24, mm = m % 60; return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
function computeTimeline(day, hotel){
  let cur = toMin(day.depart || '08:30');
  return day.stops.map((s, i) => {
    let t = 0;
    if (i === 0){ if (hotel && s.transit && s.transit.minutes) t = s.transit.minutes; }
    else if (s.transit && s.transit.minutes) t = s.transit.minutes;
    cur += t;
    const arrive = cur;
    cur += (s.stay || 60);
    return { arrive: fmtMin(arrive), leave: fmtMin(cur) };
  });
}
/* 距离需要用户主动授权定位：点按钮再请求，避免静默失败 */
let guideDistCache = {};
function guideDistHTML(stop){
  const key = stop.place.lat + ',' + stop.place.lng;
  const st = guideDistCache[key] || { state: 'idle' };
  if (st.state === 'ok') return esc(st.text);
  if (st.state === 'loading') return '📍 正在定位…';
  if (st.state === 'error') return esc(st.text) + ' <button class="chip" data-act="guide-dist">重试</button>';
  return '<button class="chip" data-act="guide-dist">📍 查看距我多远</button>';
}
function requestGuideDist(){
  const t = getTrip(currentTripId); if (!t) return;
  if (!('geolocation' in navigator)){ showToast('当前浏览器不支持定位'); return; }
  const day = t.days[dayIndex]; if (!day) return;
  const stops = day.stops;
  const nextIdx = stops.findIndex(s => !s.done);
  if (nextIdx < 0) return;
  const stop = stops[nextIdx];
  const key = stop.place.lat + ',' + stop.place.lng;
  guideDistCache[key] = { state: 'loading' };
  renderGuide();
  navigator.geolocation.getCurrentPosition(pos => {
    const w = gcj2wgs(pos.coords.latitude, pos.coords.longitude);
    const km = haversineKm(w.lat, w.lng, stop.place.lat, stop.place.lng);
    guideDistCache[key] = { state: 'ok', text: '📍 距你约 ' + (km < 1 ? Math.round(km * 1000) + ' 米' : km.toFixed(1) + ' 公里') };
    renderGuide();
  }, err => {
    guideDistCache[key] = { state: 'error', text: err.code === 1 ? '📍 定位权限被拒绝，可在浏览器设置中开启' : '📍 定位失败，请重试' };
    renderGuide();
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371, toR = x => x * Math.PI / 180;
  const dLat = toR(lat2 - lat1), dLng = toR(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toR(lat1)) * Math.cos(toR(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

      hotel: (t.hotel ? { id: uid(), name: String(t.hotel.name || ''), address: String(t.hotel.address || ''), lat: Number(t.hotel.lat) || 0, lng: Number(t.hotel.lng) || 0 } : null),
      expenses: (t.expenses || []).slice(0, 200).map(x => ({ id: uid(), day: String(x.day || ''), cat: EXP_META[x.cat] ? x.cat : 'other', amount: Number(x.amount) || 0, note: String(x.note || '') })),
      packing: (t.packing || []).slice(0, 100).map(x => ({ id: uid(), text: String(x.text || ''), done: !!x.done, cat: PACK_META[x.cat] ? x.cat : 'other' })),
      startDate: start,
      endDate: end < start ? start : end,
      createdAt: Date.now(),
      days: days.length ? days : genDates(start, end).map(emptyDay)
    };
  });
}

function importTrips(arr){
  // 同名行程会被替换，方便行程包更新后重新导入
  arr.forEach(t => {
    const i = trips.findIndex(x => x.name === t.name);
    if (i >= 0) trips.splice(i, 1);
  });
  trips = trips.concat(arr);
  save();
  closeSheet();
  renderList();
  showToast('已导入 ' + arr.length + ' 个行程');
}

function showImportError(msg){
  const box = $('#import-error');
  if (box){ box.textContent = msg; box.style.display = 'block'; }
}

async function doImportUrl(u){
  const err = $('#import-error');
  if (err){ err.style.display = 'none'; }
  const btn = document.querySelector('[data-act="import-url"]');
  if (btn){ btn.disabled = true; btn.textContent = '正在导入…'; }
  try {
    const res = await fetch(u);
    const arr = normalizeImportedTrips(JSON.parse(await res.text()));
    if (!arr.length) throw new Error('empty');
    importTrips(arr);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  } catch(e){
    if (btn){ btn.disabled = false; btn.textContent = '从网址导入'; }
    showImportError('导入失败：网址打不开或内容格式不对');
  }
}

function openImportSheet(prefetchName){
  openSheet(
    '<div class="sheet-nav"><div class="sheet-title">导入行程</div><button class="nav-btn" data-act="sheet-cancel">取消</button></div>'
    + '<div class="import-error" id="import-error"></div>'
    + '<div class="card form-card">'
    + '<div class="form-row col"><label>从网址导入（好友分享的行程链接）</label><input id="imp-url" placeholder="如：/changsha.json 或完整链接" value="' + (prefetchName ? './' + prefetchName + '.json' : '') + '"></div>'
    + '</div>'
    + '<button class="primary-btn" data-act="import-url">从网址导入</button>'
    + '<button class="primary-btn" data-act="import-file" style="background:var(--card);color:var(--blue)">📄 从文件导入（朋友发来的备份文件）</button>'
    + '<input type="file" id="import-file-input" accept=".json,application/json" style="display:none">'
    + '<div class="card form-card" style="margin-top:12px">'
    + '<div class="form-row col"><label>或粘贴行程 JSON</label><textarea id="imp-text" class="import-area" placeholder="粘贴导出的行程 JSON"></textarea></div>'
    + '</div>'
    + '<button class="primary-btn" data-act="import-text">确认导入</button>'
    + '<div class="form-foot">导入会新增行程（同名行程自动替换）· 分享链接格式：网址/?import=行程名</div>');
  const fi = $('#import-file-input');
  if (fi) fi.addEventListener('change', () => {
    const f = fi.files && fi.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const arr = normalizeImportedTrips(JSON.parse(reader.result));
        if (!arr.length) throw new Error('empty');
        importTrips(arr);
      } catch(e){ showImportError('文件内容格式不对，无法导入'); }
    };
    reader.readAsText(f);
  });
  if (prefetchName) doImportUrl('./' + prefetchName + '.json');
}

function openExportSheet(trip){
  const json = JSON.stringify([trip]);
  openSheet(
    '<div class="sheet-nav"><div class="sheet-title">导出「' + esc(trip.name) + '」</div><button class="nav-btn" data-act="sheet-cancel">关闭</button></div>'
    + '<button class="primary-btn" id="export-copy" data-act="export-copy">📋 复制行程 JSON</button>'
    + '<button class="primary-btn" id="export-download" data-act="export-download" style="background:var(--card);color:var(--blue)">⬇️ 下载行程文件（推荐发给朋友）</button>'
    + '<textarea class="export-area" id="export-json" readonly>' + esc(json) + '</textarea>'
    + '<div class="form-foot" style="margin:10px 20px 12px">朋友收到文件后：打开 App → 导入行程 → 📄 从文件导入，即可获得同款行程</div>');
  $('#export-copy').addEventListener('click', () => {
    const btn = $('#export-copy');
    const done = () => { btn.textContent = '已复制 ✓'; showToast('已复制，可直接粘贴发给朋友'); };
    const fail = () => {
      const ta = $('#export-json');
      ta.focus(); ta.select();
      try {
        if (document.execCommand('copy')){ done(); return; }
      } catch(e){}
      btn.textContent = '自动复制失败';
      showToast('已全选文本，请手动复制（菜单→拷贝）');
    };
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(json).then(done).catch(fail);
    } else { fail(); }
  });
  $('#export-download').addEventListener('click', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = 'travelplan-' + (trip.name || '行程') + '.json';
    a.click();
  });
}

/* ============ 启动 ============ */
renderList();
applyTheme();
try {
  const hist = JSON.parse(localStorage.getItem('tp.history.v1') || '{}');
  undoStack = Array.isArray(hist.s) ? hist.s : [];
  redoStack = Array.isArray(hist.r) ? hist.r : [];
} catch(e){}
lastSavedJson = snapNow();
mapLocked = localStorage.getItem('tp.maplock') !== 'off';
const importParam = new URLSearchParams(location.search).get('import');
if (importParam) openImportSheet(importParam.replace(/[^\w-]/g, ''));
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
